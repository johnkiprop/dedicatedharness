name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Check dependencies
        run: python -m pip check
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Run portable regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise installed CLI
        run: dh doctor
      - name: Install pinned OpenCode for local protocol integration
        if: matrix.python == '3.11' && matrix.os != 'windows-latest'
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/dh-opencode" --no-audit --no-fund opencode-ai@1.19.4
      - name: Verify native OpenCode with a fake loopback model
        if: matrix.python == '3.11' && matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd tests
          DEDICATEDHARNESS_TEST_OPENCODE="$RUNNER_TEMP/dh-opencode/node_modules/.bin/opencode" \
            python -m unittest test_supervisor.NativeEngineTests -v

  package:
    name: Build wheel
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dedicatedharness-wheel
          path: dist
          if-no-files-found: error
          retention-days: 7
