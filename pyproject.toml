[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedicatedharness"
version = "0.1.0"
description = "Hardware-aware local models and bounded coding supervision for Mac engineers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["huggingface-hub>=1,<3", "httpx>=0.28,<1"]

[project.scripts]
dh = "dedicatedharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
